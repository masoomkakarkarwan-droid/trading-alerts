name: Run Trading Signal Scanner

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python main.py

      - name: Commit updated signals
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "actions@github.com"
          git add docs/signals.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update signals [skip ci]"
          git push
