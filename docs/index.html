<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Signal Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  .updated { font-size: 12px; color: #8b949e; margin-bottom: 16px; }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .symbol { font-size: 16px; font-weight: 600; }
  .signal {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 13px;
    margin-top: 6px;
  }
  .BUY { background: #1f6d3a; color: #7ee2a8; }
  .SELL { background: #6d1f1f; color: #ff9c9c; }
  .WAIT { background: #3a3a1f; color: #e8e08a; }
  .ERROR { background: #444; color: #ccc; }
  .reasoning { margin-top: 8px; font-size: 13px; color: #c9d1d9; line-height: 1.4; }
  .meta { margin-top: 8px; font-size: 11px; color: #8b949e; }
  .refresh-note { font-size: 11px; color: #8b949e; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
  <h1>Live Signal Dashboard</h1>
  <div class="updated" id="updated">Loading...</div>
  <div id="cards"></div>
  <div class="refresh-note">Auto-refreshes every 30 seconds</div>

<script>
async function loadSignals() {
  try {
    const res = await fetch('signals.json?t=' + Date.now());
    const data = await res.json();
    const cardsDiv = document.getElementById('cards');
    cardsDiv.innerHTML = '';

    let latestTime = null;
    data.forEach(item => {
      if (item.timestamp && (!latestTime || item.timestamp > latestTime)) {
        latestTime = item.timestamp;
      }
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="symbol">${item.symbol}</div>
        <span class="signal ${item.signal}">${item.signal}</span>
        <div class="reasoning">${item.reasoning || ''}</div>
        <div class="meta">
          ${item.trend ? 'Trend: ' + item.trend + ' | ' : ''}
          ${item.current_price ? 'Price: ' + item.current_price : ''}
        </div>
      `;
      cardsDiv.appendChild(card);
    });

    document.getElementById('updated').textContent =
      latestTime ? 'Last updated: ' + new Date(latestTime).toLocaleTimeString() : 'No data yet';
  } catch (e) {
    document.getElementById('updated').textContent = 'Error loading signals: ' + e.message;
  }
}

loadSignals();
setInterval(loadSignals, 30000);
</script>
</body>
</html>
