name: Run Trading Signal Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Loop scanner every 60 seconds
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "trading-agent-bot"
          git config user.email "actions@github.com"
          for i in $(seq 1 14); do
            SEC=$(date +%S)
            SEC=$((10#$SEC))
            WAIT=$(( (55 - SEC + 60) % 60 ))
            echo "Waiting ${WAIT}s to align near candle close..."
            sleep $WAIT
            echo "=== Run $i at $(date) ==="
            python main.py
            git add docs/signals.json
            git diff --quiet && git diff --staged --quiet || git commit -m "Update signals [skip ci]"
            git push || echo "push failed"
            sleep 5
          done
